<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Sim18 agent interaction widget for iframe embeds." />
<title>Sim18 Agent Interaction Widget</title>
<style>
:root {
  --bg-a: #081c33;
  --bg-b: #0d3156;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
}

body {
  padding: 0;
  overflow: hidden;
  background: transparent;
}

#sim18Widget {
  width: 100%;
  height: 100%;
}

.sim18-card {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
  aspect-ratio: auto;
  border-radius: 20px;
  overflow: hidden;
  border: 0;
  background: linear-gradient(138deg, var(--bg-a), var(--bg-b));
  box-shadow: none;
}

body.sim18-embed #sim18Widget {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

.sim18-card canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
</style>
<style id="sim18StandaloneStyles" media="not all">
body.sim18-standalone {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 10px;
  background: #071a2f;
}

body.sim18-standalone .sim18-card {
  width: min(96vw, 16.8cm);
  height: min(88vh, 10.5cm);
  max-height: 10.5cm;
  min-height: 170px;
  aspect-ratio: 8 / 5;
}

@media (max-width: 720px) {
  body.sim18-standalone {
    padding: 6px;
  }

  body.sim18-standalone .sim18-card {
    min-height: 160px;
  }
}
</style>
</head>
<body>
<section class="sim18-card" id="sim18Widget" aria-label="Agent interaction simulation">
  <canvas id="sim18Canvas" aria-label="Agents and interactions"></canvas>
</section>

<script>
(() => {
  const root = document.getElementById("sim18Widget");
  if (!root || window["__sim18BundleRequested"]) return;

  let loaded = false;
  const loadBundle = () => {
    if (loaded || window["__sim18BundleRequested"]) return;
    loaded = true;
    window["__sim18BundleRequested"] = true;
    const script = document.createElement("script");
    script.src = "main.min.js";
    script.defer = true;
    document.head.appendChild(script);
  };

  const scheduleLoad = () => {
    if ("requestAnimationFrame" in window) {
      requestAnimationFrame(() => requestAnimationFrame(loadBundle));
    } else {
      window.setTimeout(loadBundle, 0);
    }
  };

  if ("IntersectionObserver" in window) {
    const observer = new IntersectionObserver((entries) => {
      if (!entries.length) return;
      const entry = entries[0];
      if (!entry.isIntersecting && entry.intersectionRatio <= 0) return;
      observer.disconnect();
      scheduleLoad();
    }, { rootMargin: "280px 0px" });
    observer.observe(root);
  } else {
    scheduleLoad();
  }

  root.addEventListener("pointerdown", loadBundle, { once: true, passive: true });
  root.addEventListener("touchstart", loadBundle, { once: true, passive: true });
  root.addEventListener("focusin", loadBundle, { once: true });
})();
</script>
</body>
</html>
