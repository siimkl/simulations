<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Simfluence Hero Loop</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #0d3558;
      --bg-1: #1a4f7c;
      --accent: #1e96ec;
      --success: #ff7f22;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(158, 186, 214, 0.34), transparent 32%),
        radial-gradient(circle at 76% 18%, rgba(95, 184, 250, 0.3), transparent 30%),
        radial-gradient(circle at 72% 68%, rgba(255, 161, 96, 0.18), transparent 28%),
        linear-gradient(180deg, #154164 0%, var(--bg-1) 54%, var(--bg-0) 100%);
    }

    main {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
    }

    main::before,
    main::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    main::before {
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.08), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.08)),
        radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.08), transparent 42%);
      mix-blend-mode: screen;
      opacity: 0.88;
    }

    main::after {
      background:
        radial-gradient(circle at center, transparent 52%, rgba(6, 16, 26, 0.1) 82%, rgba(6, 16, 26, 0.26) 100%),
        linear-gradient(180deg, rgba(8, 18, 30, 0.08), rgba(8, 18, 30, 0));
    }

    [data-hero-scene] {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <main aria-label="Animated communication comparison">
    <div data-hero-scene></div>
  </main>

  <script defer src="./main.js"></script>
</body>
</html>
